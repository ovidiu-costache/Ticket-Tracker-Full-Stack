<p>Dashboard - Filtreaza dupa status:</p>

<!-- Iteram prin statisticile date de backend si pastram colorarea ta simpla -->
@for (stat of stats; track stat.status) {
    <button (click)="setFilter(stat.status)" [style.color]="currentFilter === stat.status ? 'green' : 'black'">
        {{ stat.status }} ({{ stat.totalTickets }})
    </button>
}

<br><br>

<button (click)="setFilter(null)" [style.color]="currentFilter === null ? 'green' : 'black'">Arata Toate (Reset)</button>

<br><br>
