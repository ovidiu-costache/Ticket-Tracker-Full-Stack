<div>
    <!--Am legat atributul HTML [title] de description-->
    <h3>
        <a [routerLink]="['/tickets', ticket.ticketKey]">Titlu: {{ ticket.title | titlecase }}</a>
    </h3>

    <p>Descriere: {{ ticket.description }}</p>

    <p>Creat: {{ ticket.createdAt | date:'medium' }}</p>

    <p>Cheie: {{ ticket.ticketKey }}</p>

    <p>Status: {{ ticket.statusId | statusLabel }}</p>

    <p>Prioritate: {{ ticket.priorityId | priorityLabel:true }}</p>

    <!--Butonul care declanseaza metoda de output-->
    <button (click)="removeTicket()">Sterge acest tichet</button>
</div>
