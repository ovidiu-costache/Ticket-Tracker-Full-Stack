<div class="ticket-card">
  <h3>{{ ticket.title }}</h3>
  <p class="description">{{ ticket.description }}</p>
  <div class="badges">
    <span class="badge status-badge">Status: {{ ticket.status }}</span> | 
    <span class="badge priority-badge">Prioritate: {{ ticket.priority }}</span>
  </div>
  <br>
  <a [routerLink]="['/tickets', ticket.ticketKey]" class="details-link">Vezi detalii →</a>
</div>
